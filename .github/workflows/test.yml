name: Test

on:
  push:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      any_changed: ${{ steps.files.outputs.any_changed }}
      go_any_changed: ${{ steps.files.outputs.go_any_changed }}
      actions_any_changed: ${{ steps.files.outputs.actions_any_changed }}
      md_any_changed: ${{ steps.files.outputs.md_any_changed }}
      release_any_changed: ${{ steps.files.outputs.release_any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run changes
        id: files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            md:
              - '**.md'
            go:
              - '**.go'
              - go.mod
              - go.sum
            actions:
              - .github/workflows/**.yml
              - .github/workflows/**.yaml
            release:
              - .goreleaser.yaml
              - aqua.yaml
              - .github/workflows/release.yml

  actionlint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.actions_any_changed == 'true'
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aquaproj/aqua-installer@d1fe50798dbadd4eb5b98957290ca175f6b4870f # v4.0.2
        with:
          aqua_version: v2.53.9

      - name: Run actionlint
        run: actionlint

      - name: Run ghalint
        run: ghalint run

  go-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go_any_changed == 'true'
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

  goreleaser-check:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.release_any_changed == 'true'
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aquaproj/aqua-installer@d1fe50798dbadd4eb5b98957290ca175f6b4870f # v4.0.2
        with:
          aqua_version: v2.53.9

      - name: Run goreleaser check
        run: goreleaser check

  test-no-need:
    name: Empty
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any_changed == 'false'
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Skip
        run: echo "No changes in files related to tests, skipping."
